      - Host is substantially underutilized based on the provided screenshot.
      - VM 104 naming aligns with buzz-all-in-one, whose historical design was an isolated Proxmox AI-development VM using Coolify, Buzz, OmniRoute, Goose and OpenCode. Treat this as intent until live services are captured.
      - VM 105 naming aligns with zentari-logging, whose historical design includes Grafana, Prometheus, Loki, Alloy, Alertmanager, Uptime Kuma, Blackbox Exporter and OpenTelemetry Collector, with optional separate Langfuse, PostHog, Coolify, Gitea and backup planes. Treat this as intent until live services are captured.
