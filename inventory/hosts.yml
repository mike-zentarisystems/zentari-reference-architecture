      sockets: 2
      logical_cpus: 32
      clock_ghz: 2.40
    memory_gb: 125.85
    swap_gb: 8
    local_storage_gb_visible: 77.79
    boot_mode: legacy-bios
    observed_vms:
      - vmid: 101
        name: PNET4.2.4
        state: observed
      - vmid: 103
        name: zentari-openmanus
        state: observed
      - vmid: 104
        name: zentari-buzz
        state: observed
        historical_repo_match: mike-zentarisystems/buzz-all-in-one
        historical_intent: isolated-ai-development-vm
      - vmid: 105
        name: zentari-observability
        state: running
        vcpu: 4
        memory_gb: 8
        bootdisk_gb: 200
        historical_repo_match: mike-zentarisystems/zentari-logging
        historical_intent: observability-core-and-operations-platform
