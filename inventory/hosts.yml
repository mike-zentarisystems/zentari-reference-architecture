    platform: bare-metal
    role: zentari-ai-only
    customer_workloads_allowed: false
    management: tailscale-target
    known:
      cpu: Intel-Core-i7-6700
      cpu_cores_threads: 4c-8t
      memory_gb: 16
      gpu: NVIDIA-RTX-3060-12GB
      motherboard: Dell-0C2XKD-A00
      repo: mike-zentarisystems/citidel
    notes:
      - Citadel is reserved for Zentari AI compute and internal agent workloads.
      - Customer systems of record and customer production applications must not live here.
      - July 3 repo snapshot showed Hermes, Ollama, LiteLLM, n8n, pgvector/Postgres, Valkey, Qdrant, MinIO, AnythingLLM, Traefik, Uptime Kuma, Browserless, OpenCode, SearXNG, Stirling PDF, Honcho and other utilities.
