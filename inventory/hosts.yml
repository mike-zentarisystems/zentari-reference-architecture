    status: observed-current-target-conversion
    evidence: user-provided-esxi-screenshot-2026-08-07-and-architecture-decision
    current_platform: VMware-ESXi-6.7.0-Update-2-build-13006603
    target_platform: proxmox
    hardware: Dell-PowerEdge-R410
    role: infrastructure-backup-recovery
    customer_workloads_allowed: false
    cpu:
      model: Intel-Xeon-E5645
      logical_cpus: 12
      clock_ghz: 2.40
    memory_gb: 55.99
    datastore:
      capacity_tb: 1.81
      free_tb: 1.61
      used_gb_approx: 203.43
    management:
      current_ipv4: 192.168.1.40
      default_gateway: 192.168.1.1
    notes:
      - Target is to replace the old ESXi installation with Proxmox to standardize virtualization.
      - Preferred future roles are local backup repository, restore testing, long-retention observability storage, templates/ISOs and infrastructure utility VMs.
      - Existing VMware VM(s) must be inventoried and preserved or intentionally retired before reinstallation.
      - zentari-logging historically proposed Proxmox Backup Server on separate storage and Restic application backups to Backblaze B2; this is useful reference design, not proof of current deployment.
    validation_needed: [current_vm_inventory, disk_smart, raid_controller, raid_health, firmware, nic_layout, datastore_files, backup_of_existing_vms, proxmox_install_plan, power, ups]

  - id: watchtower
    display_name: oracle-oci
    status: observed-partial
    evidence: user-confirmed-resources-plus-oracle-hermes-repo-intent
    platform: oracle-oci-ampere-arm64
    role: offsite-watchtower-dr
    customer_workloads_allowed: false
    cpu_ocpu: 4
    memory_gb: 24
    storage_gb: 200
    known_workloads:
      - Hermes-secondary
    historical_repo:
      name: mike-zentarisystems/oracle-hermes
      intended_runtime: bare-oracle-linux-systemd
      intended_access: tailscale-only
      intended_components: [hermes-agent, hermes-gateway, hermes-webui, optional-api-bridge, optional-telegram, optional-tiny-ollama, optional-citadel-routing]
    notes:
      - Physically and operationally independent from the basement and production VPS.
      - Oracle-Hermes design explicitly makes this VM an always-on agent control node, with serious local GPU inference remaining on Citadel.
      - Historical design binds Hermes WebUI locally, prefers Tailscale SSH and exposes no Hermes/Ollama/dashboard ports publicly by default.
      - Repo state may not match the live OCI VM. Live systemd, ports, Tailscale and services still require capture.
      - Preferred future role adds external health checks, emergency administration and backup verification without making Oracle a customer system-of-record host.
    validation_needed: [region, exact_shape, operating_system, billing_status, free_tier_eligibility, public_private_ips, running_services, systemd_units, exposed_ports, backup_policy, tailscale_state]
